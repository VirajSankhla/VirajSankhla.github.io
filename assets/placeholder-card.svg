<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title>Placeholder finance card</title>
  <desc>Dark premium placeholder graphic with grid and market line accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1620"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ddc07a"/>
      <stop offset="100%" stop-color="#c9a85b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7aa7ff" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="250" cy="180" r="110" fill="#c9a85b" opacity="0.08" filter="url(#blur)"/>
  <circle cx="950" cy="650" r="160" fill="#7aa7ff" opacity="0.07" filter="url(#blur)"/>
  <path d="M120 600 L240 540 L340 560 L460 430 L580 470 L720 330 L840 360 L960 260 L1080 290" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 650 L240 610 L340 630 L460 520 L580 555 L720 450 L840 470 L960 385 L1080 410" fill="none" stroke="url(#blue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f4f6f9" opacity="0.78">
    <circle cx="120" cy="600" r="7"/>
    <circle cx="240" cy="540" r="7"/>
    <circle cx="340" cy="560" r="7"/>
    <circle cx="460" cy="430" r="7"/>
    <circle cx="580" cy="470" r="7"/>
    <circle cx="720" cy="330" r="7"/>
    <circle cx="840" cy="360" r="7"/>
    <circle cx="960" cy="260" r="7"/>
    <circle cx="1080" cy="290" r="7"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5">
    <rect x="84" y="84" width="1032" height="632" rx="32"/>
    <rect x="112" y="112" width="976" height="576" rx="24"/>
  </g>
  <text x="120" y="172" fill="#f4f6f9" font-family="Manrope, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="0.12em">PLACEHOLDER</text>
  <text x="120" y="228" fill="#a9b3c2" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="0.28em">FINANCE SHOWCASE CARD</text>
</svg>
